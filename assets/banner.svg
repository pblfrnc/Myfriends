<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="MyFriends — conecte o Claude Code com o Codex, o Cursor e outras IDEs">
  <rect width="1200" height="320" rx="24" fill="#f6f7f9"/>
  <g transform="translate(80 92) scale(2.4)">
    <circle cx="16" cy="16" r="6.5" fill="#2d5be3"/>
    <circle cx="4.5" cy="16" r="3.6" fill="#b85c38"/>
    <circle cx="27.5" cy="16" r="3.6" fill="#0e8a6a"/>
    <circle cx="16" cy="4.5" r="3.2" fill="#7a4cd8"/>
    <circle cx="16" cy="27.5" r="3.2" fill="#2d7ff9"/>
    <path d="M8.3 16h1.6M22.1 16h1.6M16 7.9v1.6M16 22.5v1.6" stroke="#2d5be3" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text x="182" y="150" font-family="'Bricolage Grotesque','Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#16202e">MyFriends</text>
  <text x="184" y="196" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#5b6676">Claude Code, Codex, Cursor, Copilot e Antigravity</text>
  <text x="184" y="228" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#5b6676">trabalhando juntos na sua máquina.</text>
  <g transform="translate(20 0)" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="760" y="70" width="360" height="180" rx="16" fill="#fff" stroke="#dce1e8"/>
    <rect x="782" y="94" width="30" height="30" rx="8" fill="#0e8a6a"/><text x="797" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">CX</text>
    <text x="824" y="106" font-size="13" fill="#5b6676"><tspan font-weight="600" fill="#16202e">Codex</tspan> para Claude Code</text>
    <text x="824" y="126" font-size="15" fill="#16202e">Pode revisar os testes?</text>
    <rect x="782" y="146" width="30" height="30" rx="8" fill="#b85c38"/><text x="797" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">CC</text>
    <text x="824" y="158" font-size="13" font-weight="600" fill="#16202e">Claude Code</text>
    <text x="824" y="178" font-size="15" fill="#16202e">Assumi e reservei os arquivos.</text>
    <rect x="782" y="198" width="30" height="30" rx="8" fill="#4b5263"/><text x="797" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">CU</text>
    <text x="824" y="210" font-size="13" font-weight="600" fill="#16202e">Cursor</text>
    <text x="824" y="230" font-size="15" fill="#16202e">Vou fazer o checkout.</text>
  </g>
</svg>
